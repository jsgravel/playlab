<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183f36"><meta name="description" content="A gentle matching adventure. Follow the tiles, collect little stars, and hop home.">
  <title>Tile Hop · A little climb</title>
  <link rel="stylesheet" href="style.css"><script src="game.js" defer></script>
</head>
<body>
<main class="app">
  <header><a class="brand" href="./">tile<span>hop</span><i>✦</i></a><button id="sound" class="icon-button" aria-label="Enable sound" aria-pressed="false">♫ <span>off</span></button></header>
  <section class="intro"><div class="eyebrow">A LITTLE CLIMB, A LITTLE JOY</div><h1>One hop closer<br>to the clouds.</h1><p>Find your match. Follow your curiosity.</p></section>
  <section class="game" aria-label="Tile Hop game">
    <div class="game-top"><div><span class="eyebrow" id="chapter">THE CLOVER GARDEN</span><h2 id="level-title">First little steps</h2></div><button id="levels" class="level-pill" aria-label="Choose level">01 / 12</button></div>
    <div class="progress" aria-label="Climb progress"><div id="progress"></div></div>
    <div class="playfield" id="playfield"><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div id="board" class="board"></div><div class="ground"><span>✿</span><span>✿</span><span>✿</span></div></div>
    <div class="instruction"><div id="match" class="match-symbol"></div><div><strong id="prompt">Find a matching tile</strong><span id="subprompt">The little symbol shows your next match.</span></div><div class="star-count" aria-label="Stars collected">✦ <span id="stars">0</span></div></div>
    <div class="controls"><button id="undo">↶ <span>Undo</span></button><button id="restart">↻ <span>Restart</span></button><button id="hint">☀ <span>Hint</span></button></div>
  </section>
  <footer><span>No rush. Just a little adventure.</span><button id="help">How to play ↗</button></footer>
</main>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<div id="announcement" class="sr-only" aria-live="polite"></div>
</body></html>
